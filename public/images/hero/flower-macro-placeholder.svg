<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Abstract macro chenille flower placeholder</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="74%">
      <stop offset="0" stop-color="#6F5B62"/>
      <stop offset=".46" stop-color="#2F4937"/>
      <stop offset="1" stop-color="#16241B"/>
    </radialGradient>
    <radialGradient id="blush" cx="45%" cy="28%" r="78%">
      <stop stop-color="#FBF7F1"/>
      <stop offset=".35" stop-color="#E9C9C9"/>
      <stop offset="1" stop-color="#9E6876"/>
    </radialGradient>
    <radialGradient id="lilac" cx="45%" cy="25%" r="80%">
      <stop stop-color="#F7F0E6"/>
      <stop offset=".38" stop-color="#C9B6E4"/>
      <stop offset="1" stop-color="#705F8B"/>
    </radialGradient>
    <filter id="fiber" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence baseFrequency=".018 .11" numOctaves="2" seed="12" type="fractalNoise" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="B"/>
      <feDropShadow dx="0" dy="18" flood-color="#16241B" flood-opacity=".35" stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <path id="petal-a" d="M960 529C745 500 591 328 656 156c173 38 317 168 304 373Z"/>
    <path id="petal-b" d="M960 529C788 470 701 270 806 124c143 82 238 236 154 405Z"/>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g opacity=".24" filter="url(#soft)">
    <circle cx="276" cy="210" r="112" fill="#E9C9C9"/>
    <circle cx="1668" cy="248" r="156" fill="#C9B6E4"/>
    <circle cx="1540" cy="914" r="118" fill="#D6B98A"/>
  </g>
  <g filter="url(#fiber)">
    <use href="#petal-a" fill="url(#blush)"/>
    <use href="#petal-a" fill="url(#lilac)" transform="rotate(45 960 529)"/>
    <use href="#petal-b" fill="url(#blush)" transform="rotate(90 960 529)"/>
    <use href="#petal-a" fill="url(#lilac)" transform="rotate(135 960 529)"/>
    <use href="#petal-b" fill="url(#blush)" transform="rotate(180 960 529)"/>
    <use href="#petal-a" fill="url(#lilac)" transform="rotate(225 960 529)"/>
    <use href="#petal-b" fill="url(#blush)" transform="rotate(270 960 529)"/>
    <use href="#petal-a" fill="url(#lilac)" transform="rotate(315 960 529)"/>
  </g>
  <g fill="none" stroke-linecap="round" transform="translate(0 -11)">
    <circle cx="960" cy="529" r="132" stroke="#D6B98A" stroke-width="46" stroke-dasharray="7 14"/>
    <circle cx="960" cy="529" r="88" stroke="#B8925A" stroke-width="38" stroke-dasharray="5 10"/>
    <circle cx="960" cy="529" r="48" stroke="#F7F0E6" stroke-width="24" stroke-dasharray="3 9"/>
  </g>
  <circle cx="960" cy="518" r="21" fill="#1F3326"/>
  <circle cx="953" cy="511" r="7" fill="#D6B98A"/>
</svg>
